[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "quranic-phonemizer"
dynamic = ["version"]
description = "A riwayah-aware grapheme-to-phoneme converter for Quranic recitation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ahmed Ibrahim", email = "ahmed.ibrahim8165@gmail.com" },
]
keywords = ["phonemizer", "g2p", "grapheme-to-phoneme", "quran", "quranic", "arabic", "tajweed", "nlp", "tts", "asr", "speech", "ipa"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Arabic",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.12",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]  # Quality.I is domain vocabulary, not a throwaway name.

[project.urls]
Homepage = "https://quranicphonemizer.com"
Repository = "https://github.com/QUD-Technologies/quranic-phonemizer"
Issues = "https://github.com/QUD-Technologies/quranic-phonemizer/issues"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["quranic_phonemizer*"]
exclude = ["quranic_phonemizer.phonemize*"]

[tool.setuptools.package-data]
quranic_phonemizer = [
    "data/**/*.bin",
    "data/**/*.gz",
    "data/**/*.json",
    "data/**/*.yaml",
]
